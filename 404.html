<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - This page dumped core</title>
    <meta name="description" content="The page you were looking for seems to have wandered off into /dev/null.">
    <link rel="icon" href="./images/favicon.ico" sizes="any">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700;800&family=PT+Serif:wght@400;700&display=swap');
        :root { --accent:#e7651a; --link:#990000; --ink:#101820; }
        * { box-sizing:border-box; }
        body { min-height:100vh; margin:0; padding:clamp(1.25rem,4vw,3rem) 1rem; border-top:10px solid var(--accent); background:#fff url('./images/blue-dash.gif') repeat; color:var(--ink); font-family:"PT Serif",Georgia,serif; }
        .error-page { width:min(100%,1100px); margin:0 auto; padding:clamp(.75rem,2vw,1.5rem); border:1px solid #c9c9c9; border-radius:10px; background:rgba(255,255,255,.97); }
        .poster { display:block; width:100%; height:auto; border-radius:4px; }
        .caption { margin:.9rem 0 .7rem; text-align:center; font-size:1rem; }
        .caption strong { font-family:Lora,Georgia,serif; }
        a { color:var(--link); font-weight:700; text-underline-offset:.12em; } a:focus-visible { outline:3px solid var(--accent); outline-offset:4px; }
        .nav { text-align:center; font-size:1.05rem; word-spacing:.18rem; } .nav a { margin:0 .18rem; }
        .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
        @media (max-width:520px) { body { padding-inline:.5rem; } .error-page { padding:.4rem; } .caption { padding-inline:.6rem; } }
    </style>
</head>
<body>
    <main class="error-page">
        <h1 class="sr-only">404: This page dumped core</h1>
        <figure>
            <img class="poster" src="./images/404.webp" alt="Hand-drawn 404 illustration with a broken number, a developer at a computer, terminal log, cats, and coding notes." loading="eager" decoding="async"
            <figcaption class="caption"><strong>Don't panic. Even good links segfault sometimes. ;-)</strong></figcaption>
        </figure>
        <nav class="nav" aria-label="Helpful links">
            <a href="./">Home</a> |
            <a href="https://indrayam.com/archives/index.html">Archives</a> |
            <a href="https://indrayam.com/aboutme.html">About Me</a>
        </nav>
    </main>
</body>
</html>
